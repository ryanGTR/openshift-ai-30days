# 模型服務用的 ServiceAccount（對應 Day 10、Day 19、Day 20）
#
# ⭐ 這份是整套裡最容易漏、漏了最難查的一個：
#
#   secrets: minio-s3
#     → KServe 的 storage-initializer **從 SA 的 secrets 清單找 S3 憑證**。
#       漏了它，init container 會抓不到模型，而 ISvc 只會一直 not ready。
#
#   imagePullSecrets: harbor-pull
#     → 建了 Secret ≠ 有人在用它（Day 19）。要嘛連到 SA，要嘛在 pod 上明寫。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-sa
  namespace: llm-serve-demo
secrets:
  - name: minio-s3
imagePullSecrets:
  - name: harbor-pull
