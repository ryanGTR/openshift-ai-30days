# S3 與 registry 憑證（對應 Day 7、Day 19、Day 21）
#
# ⚠️ 這裡有兩份 S3 憑證，不是重複——它們被三套不同的慣例讀取：
#     minio-s3         → KServe 的 storage-initializer、DSPA、pipeline 讀它（只要兩個 key）
#     minio-connection → dashboard 讀它（要 label + annotation + 五個 key）
#    Day 7 講過：同一個叢集上 S3 設定有三套並存的慣例
#    （dashboard 讀 label、KServe 讀 annotation、你的程式讀 data key）。
#
# 🔴 CHANGE_ME 全部要換掉。這份檔案填好之後就不要進版控。
---
# ① 給 KServe / DSPA / pipeline 用
apiVersion: v1
kind: Secret
metadata:
  name: minio-s3
  namespace: llm-serve-demo
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: CHANGE_ME
  AWS_SECRET_ACCESS_KEY: CHANGE_ME
---
# ② 給 dashboard 顯示用（Connections 分頁）
apiVersion: v1
kind: Secret
metadata:
  name: minio-connection
  namespace: llm-serve-demo
  labels:
    opendatahub.io/dashboard: "true"       # ← 沒有這個 dashboard 看不到
    opendatahub.io/managed: "true"
  annotations:
    opendatahub.io/connection-type-ref: s3
    openshift.io/display-name: "MinIO（模型與 pipeline 產物）"
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: CHANGE_ME
  AWS_SECRET_ACCESS_KEY: CHANGE_ME
  AWS_S3_ENDPOINT: http://minio.lab:9000   # ⚠️ boto3 要完整 URL（含 scheme）
  AWS_DEFAULT_REGION: us-east-1
  AWS_S3_BUCKET: models
---
# ③ 私有 registry 的 pull 憑證
#    ⚠️ 用指令建比較不會出錯（Harbor 的 robot 帳號含 $ 和 +，一定要單引號）：
#      oc create secret docker-registry harbor-pull \
#        --docker-server=registry.lab:8088 \
#        --docker-username='robot$odh+puller' \
#        --docker-password='<token>' -n llm-serve-demo
apiVersion: v1
kind: Secret
metadata:
  name: harbor-pull
  namespace: llm-serve-demo
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths":{"registry.lab:8088":{"username":"CHANGE_ME","password":"CHANGE_ME","auth":"CHANGE_ME_BASE64"}}}'
