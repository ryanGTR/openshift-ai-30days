# Connection — 讓叢集裡的東西讀得到叢集外的資料（對應 Day 7）
#
# ⚠️ 它不是 CRD，是一個貼了特定 label 的 Secret。所以 `oc get connections` 查不到東西。
#
# 型別定義（要填哪些欄位）在叢集上，不用翻文件：
#   oc get cm s3 -n opendatahub -o jsonpath='{.data.fields}' | jq -r '.[] | "\(.envVar) required=\(.required)"'
#
# ⚠️ dashboard 顯示它「存在」只代表格式正確（label 有、必填欄位有值）。
#    它不會拿那組憑證去連一次 —— 一定要在 workbench 裡真的 list 一次 bucket 才算設好。
apiVersion: v1
kind: Secret
metadata:
  name: minio-s3
  namespace: llm-serve-demo
  labels:
    opendatahub.io/dashboard: "true"          # ← 沒有這個，dashboard 看不到
    opendatahub.io/managed: "true"
  annotations:
    opendatahub.io/connection-type-ref: s3
    openshift.io/display-name: "MinIO（模型與 pipeline 產物）"
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: CHANGE_ME
  AWS_SECRET_ACCESS_KEY: CHANGE_ME
  AWS_S3_ENDPOINT: http://minio.lab:9000     # ⚠️ boto3 要完整 URL
  AWS_DEFAULT_REGION: us-east-1
  AWS_S3_BUCKET: models
# ⚠️ KServe 用的是另一組慣例 —— 不是 label，是 ISvc 上的 annotation：
#      serving.kserve.io/s3-endpoint: minio.lab:9000   ← 不含 http://
#      serving.kserve.io/s3-usehttps: "0"
#    同一個叢集上 S3 設定有三套並存的慣例：dashboard 讀 label、KServe 讀 annotation、
#    你的程式讀 data key。一份 Secret 要同時滿足三套，才會「到處都正常」。
